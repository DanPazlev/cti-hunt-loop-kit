name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sigma:
    name: Sigma rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Sigma tooling
        run: pip install "sigma-cli==4.0.0" "pysigma-backend-splunk==3.0.0"

      - name: Check Sigma rules (syntax and best practices)
        run: sigma check queries/sigma

      - name: Test-convert Sigma rules to Splunk SPL
        run: sigma convert -t splunk --without-pipeline queries/sigma
